<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container p-2">

    <div class="hstack gap-3 mb-3">
        <h2><span class="badge text-bg-success">Витрина магазина</span></h2>

        <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
        <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
    </div>

    <div class="row p-2" th:each="itemsRow : ${items}">
        <div class="col" th:each="item : ${itemsRow}">

            <div class="card" th:if="${item.id != -1}">
                <a th:href="@{'/items/' + ${item.id}}">
                    <img th:src="${item.imgPath}" class="card-img-top" alt="Нет изображения">
                </a>

                <div class="card-body">
                    <h5 class="card-title" th:text="${item.title}"></h5>

                    <span class="badge text-bg-success"
                          th:text="${item.price + ' руб.'}"></span>

                    <p class="card-text" th:text="${item.description}"></p>

                    <form method="post" th:action="@{/items}">
                        <input type="hidden" name="id" th:value="${item.id}">
                        <input type="hidden" name="search" th:value="${search}">
                        <input type="hidden" name="sort" th:value="${sort}">
                        <input type="hidden" name="pageSize" th:value="${paging.pageSize}">
                        <input type="hidden" name="pageNumber" th:value="${paging.pageNumber}">

                        <div class="hstack gap-2">
                            <button class="btn btn-outline-secondary" name="action" value="MINUS">-</button>

                            <span th:text="${item.count}"></span>

                            <button class="btn btn-outline-secondary" name="action" value="PLUS">+</button>

                            <button class="btn btn-warning ms-auto bi bi-cart4"
                                    name="action" value="PLUS"
                                    th:if="${item.count == 0}">
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
