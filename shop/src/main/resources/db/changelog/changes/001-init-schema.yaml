databaseChangeLog:
  - changeSet:
      id: 001
      author: vladimir kovtunov

      changes:

        - createTable:
            tableName: items
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(5000)

              - column:
                  name: img_path
                  type: VARCHAR(255)

              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

        - createTable:
            tableName: orders
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: total_sum
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: order_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: order_items
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: item_id
                  type: BIGINT

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: price
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: count
                  type: INT

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order