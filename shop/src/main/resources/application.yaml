spring:
  application:
    name: shop-app

  session:
    store-type: redis
    redis:
      namespace: spring:session
    timeout: 30m

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false


  datasource:
    url: jdbc:postgresql://localhost:5432/market-app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/market-app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.yourpackage: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080


payment-service:
   url: http://localhost:8081
